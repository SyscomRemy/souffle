<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SOUFFLE</title>
<style>
  :root{--bg:#02040a;--ink:#eaf2ff;--dim:#6f84a1;--o2:#55e6ff;--warn:#ff5f52;--tether:#ffd166;--flux:#b98cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;top:0;left:0}
  .hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 22px;pointer-events:none;z-index:2;background:linear-gradient(rgba(6,10,22,.45),rgba(6,10,22,0))}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .score{font-size:35px;font-weight:650;letter-spacing:-.028em;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 20px rgba(120,190,255,.4)}
  .meta{font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-top:5px;font-variant-numeric:tabular-nums}
  .flux{text-align:right;color:var(--flux)}
  .fluxn{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;transition:transform .08s ease-out;text-shadow:0 0 18px currentColor}
  .fluxn.pop{transform:scale(1.4)}
  .fbar{margin:6px 0 0 auto;width:64px;height:3px;border-radius:2px;background:#0e1520;overflow:hidden}
  .ffill{height:100%;width:0;background:currentColor}
  .fluxl{font-size:9.5px;color:var(--dim);letter-spacing:.18em;margin-top:5px;font-variant-numeric:tabular-nums}
  .fluxl.hot{color:var(--ink)}
  .bar{margin-top:9px;height:4px;border-radius:3px;background:#0e1520;overflow:hidden}
  .fill{height:100%;width:100%;background:var(--o2);border-radius:3px;box-shadow:0 0 12px rgba(85,230,255,.7)}
  .fill.low{background:var(--warn);box-shadow:0 0 12px rgba(255,95,82,.8)}
  .snd{pointer-events:auto;display:none;margin:0;width:max-content;font-size:10px;letter-spacing:.14em;font-weight:650;color:#0b1220;background:var(--o2);border-radius:999px;padding:7px 14px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .snd.show{display:none}   /* bannière retirée : l'icône ♪ suffit à débloquer l'audio */
  #chal{display:none}       /* objectifs retirés de l'écran de choix ; #fchal les garde à l'arrivée */
  #gradeline{display:none}  /* grade et compteur de missions retirés de l'accueil */
  .playbtn{pointer-events:auto;margin-top:16px;border:1px solid rgba(85,230,255,.55);background:rgba(10,30,48,.72);
    color:var(--ink);border-radius:999px;padding:13px 46px;font-size:15px;letter-spacing:.3em;text-indent:.3em;
    font-weight:650;font-family:inherit;box-shadow:0 0 30px rgba(85,230,255,.18);transition:transform .12s ease}
  .playbtn:active{transform:scale(.94)}
  .langrow{pointer-events:auto;display:flex;gap:10px;margin-top:18px}
  .lang{pointer-events:auto;border:1px solid rgba(120,150,190,.22);background:rgba(6,14,26,.55);
    border-radius:10px;padding:5px 9px;font-size:19px;line-height:1;opacity:.4;font-family:inherit;
    transition:opacity .15s ease,transform .12s ease,border-color .15s ease}
  .lang.on{opacity:1;border-color:rgba(85,230,255,.6);background:rgba(11,30,48,.72)}
  .lang:active{transform:scale(.9)}
  #mis{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 128px);transform:translateX(-50%) translateY(-14px);width:min(86vw,420px);
  display:flex;align-items:flex-start;gap:9px;
  padding:9px 12px 10px;border:1px solid rgba(120,220,255,.34);border-left:3px solid rgba(120,220,255,.85);
  background:linear-gradient(180deg,rgba(8,16,26,.90),rgba(6,10,18,.84));border-radius:4px 13px 13px 13px;
  font:600 12.5px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.07em;color:#cfeaff;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:6;
  box-shadow:0 6px 26px rgba(0,0,0,.5),inset 0 0 22px rgba(90,200,255,.06)}
#mis.show{opacity:1;transform:translateX(-50%) translateY(0)}
#mis.mini{padding:6px 10px 7px;gap:7px}
#misBody{flex:1;min-width:0}
#misBot{flex:0 0 auto;width:26px;height:26px;margin-top:-1px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(120,220,255,.34),rgba(90,190,255,.10) 70%,transparent);
  box-shadow:0 0 0 1px rgba(120,220,255,.35),0 0 16px rgba(90,200,255,.22);
  display:flex;align-items:center;justify-content:center}
#misBot svg{width:19px;height:19px;fill:#9fe2ff;position:relative;inset:auto;display:block}
#misBot .eye{fill:#eafaff}
#mis.show #misBot .eye{animation:blink 4.2s steps(1,end) infinite}
#mis.mini #misBot{width:20px;height:20px}
#mis.mini #misBot svg{width:14px;height:14px}
#mis.ok #misBot svg{fill:#ffd166}
#mis.ok #misBot{box-shadow:0 0 0 1px rgba(255,209,102,.45),0 0 18px rgba(255,190,80,.25)}
@keyframes blink{0%,94%{opacity:1}95%,98%{opacity:.12}99%,100%{opacity:1}}
#mis.mini #misT{display:none}
#misH{font-size:9.5px;letter-spacing:.18em;color:#79d4ff;opacity:.8;margin-bottom:3px}
#misT{color:#eaf6ff;margin-top:2px}
#misP{position:relative;height:2px;margin-top:6px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#misP i{position:absolute;left:0;top:0;bottom:0;width:0;background:#79d4ff;transition:width .18s linear}
#mis.ok{border-color:rgba(255,209,102,.6);border-left-color:#ffd166}
#mis.ok #misH,#mis.ok #misP i{color:#ffd166;background:#ffd166}
#mis.ko{border-left-color:rgba(255,110,110,.8)}
.sndrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:9px}
  .mute{pointer-events:auto;width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;

  #end #crewopen2 canvas{width:88px;height:94px}
  #end .pick canvas{width:88px;height:94px}

  .big{font-size:60px;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
  .best{font-size:12px;color:var(--dim);letter-spacing:.11em;max-width:320px;line-height:1.5}
  .newbest{color:var(--tether)}
  #poster{width:min(74vw,320px);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6);-webkit-touch-callout:default;touch-action:auto}
  #posterhint{opacity:.45;font-size:9.5px}
  .card{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.9;
    color:#c0cfe4;background:#070d16;border:1px solid #141e2c;border-radius:14px;padding:12px 20px;white-space:pre}
  .hint{font-size:13px;color:#c0cfe4;max-width:310px;line-height:1.6;margin:0}
  .again{font-size:14px;letter-spacing:.24em;font-weight:650;color:var(--o2);margin-top:10px;transition:opacity .2s}
  .again.lock{opacity:.2}
  .copy{border:1px solid #243349;background:transparent;color:var(--dim);border-radius:999px;padding:9px 20px;font-size:11px;letter-spacing:.16em;font-weight:600}
  /* ---- équipage (Zétos) : purement cosmétique ---- */
  #crew{background:rgba(2,4,10,.95);justify-content:flex-start;gap:9px;overflow-y:auto;touch-action:pan-y;z-index:12;
    padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px)}
  .crewt{margin:0;font-size:23px;letter-spacing:.34em;text-indent:.34em;font-weight:600;text-shadow:0 0 34px rgba(85,230,255,.4)}
  .crews{margin:0;font-size:9.5px;letter-spacing:.18em;color:var(--dim);line-height:1.8;max-width:300px}
  .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(94vw,360px);margin-top:2px}
  .cc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 6px;border:1px solid rgba(120,150,190,.14);
    border-radius:12px;background:rgba(8,14,26,.5);transition:transform .12s ease,border-color .15s}
  .cc:active{transform:scale(.94)}
  .cc.on{border-color:rgba(85,230,255,.7);background:rgba(11,28,44,.72);box-shadow:inset 0 0 20px rgba(85,230,255,.14)}
  .cc canvas{display:block;position:relative;inset:auto;width:90px;height:96px;max-width:100%}
  .cc span{font-size:9px;letter-spacing:.14em;color:var(--dim)}
  .cc.on span{color:var(--ink)}
  .cinfo{width:min(94vw,360px);min-height:96px;text-align:left;border-left:2px solid rgba(85,230,255,.6);
    background:rgba(8,14,26,.62);border-radius:3px;padding:10px 13px}
  .cinfo b{font-size:15px;letter-spacing:.2em;font-weight:650}
  .cinfo i{display:block;font-style:normal;font-size:10px;letter-spacing:.16em;color:#79d4ff;margin:3px 0 7px}
  .cinfo p{margin:0;font-size:12.5px;line-height:1.6;color:#c0cfe4}
</style>
</head>

<script>
(function(){
"use strict";

var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var bc=document.createElement('canvas'),bx=bc.getContext('2d');
var lc=document.createElement('canvas'),lx=lc.getContext('2d');
var CW=0,CH=0,DPR=1,SC=1,visW=100,BS=0.25;
var VG=null,VGw=0,VGh=0;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  // Résolution logique plafonnée. SC (l'échelle monde→écran, plus bas)
  // dépend directement de CW : sur un écran large, CW=innerWidth explosait
  // et gonflait tout le puits — c'est exactement le "trop zoomé" sur PC.
  // Le plafond dépasse la largeur/hauteur CSS de n'importe quel téléphone
  // réel (y compris les plus grands, portrait) : sur mobile winW/winH
  // restent sous ces seuils, donc CW/CH valent innerWidth/innerHeight
  // comme avant — comportement mobile inchangé au pixel près. Au-delà,
  // on centre avec des bandes plutôt que d'élargir le champ de vision :
  // un FOV identique pour tous est aussi ce qui garde la graine du jour
  // équitable entre joueurs pour le classement.
  var winW=window.innerWidth,winH=window.innerHeight;
  CW=Math.min(winW,480);CH=Math.min(winH,1000);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  cv.style.width=CW+'px';cv.style.height=CH+'px';
  cv.style.left=Math.round((winW-CW)/2)+'px';
  cv.style.top=Math.round((winH-CH)/2)+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bc.width=Math.max(1,Math.round(CW*BS));bc.height=Math.max(1,Math.round(CH*BS));
  lc.width=bc.width;lc.height=bc.height;
}
window.addEventListener('resize',function(){resize();paintPicks();});resize();

/* ================= stockage ================= */
function sget(k,d){try{var v=localStorage.getItem('souffle.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sset(k,v){try{localStorage.setItem('souffle.'+k,JSON.stringify(v));}catch(e){}}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
var dd_=new Date(),seedStr=dstr(dd_);
var hh=2166136261;
for(var si=0;si<seedStr.length;si++){hh^=seedStr.charCodeAt(si);hh=Math.imul(hh,16777619);}
var SEED=hh>>>0,SECTOR=(SEED%900)+100;

var all=sget('all',{best:0,depth:0,chain:0});
if(all.full==null)all.full=0;if(all.comet==null)all.comet=0;if(all.mis==null)all.mis=0;if(all.misq==null)all.misq=0;if(all.ghost==null)all.ghost=null;if(all.runs==null)all.runs=0;
var UID=sget('uid','');if(!UID){UID=(Date.now().toString(36)+Math.random().toString(36).slice(2,10));sset('uid',UID);}
try{var old=parseFloat(localStorage.getItem('souffle_best')||'0')||0;if(old>all.best)all.best=old;}catch(e){}
var day=sget('day',null);if(!day||day.d!==seedStr)day={d:seedStr,best:0,depth:0,runs:0,ghost:null};
var H=sget('hints',{anchor:0,reel:0,inhale:0,eject:0});
var streak=(function(){var s=sget('streak',{last:'',n:0});var y=new Date(dd_);y.setDate(y.getDate()-1);
  if(s.last!==seedStr){s.n=(s.last===dstr(y))?s.n+1:1;s.last=seedStr;sset('streak',s);}return s;})();
document.getElementById('seedline').textContent='SECTEUR '+SECTOR+'  ·  LE MÊME POUR TOUS AUJOURD’HUI';

  (day.best>0?'RECORD DU JOUR '+Math.round(day.best).toLocaleString('fr-FR'):'')+

/* ================= réseau (optionnel, additif, jamais bloquant) =================
   NET='' => le jeu est 100 % hors ligne et identique à avant.
   Colle ici l'URL de ton worker déployé (voir worker/DEPLOY.md) pour activer
   le percentile du jour, la division, et le fantôme du meneur.               */
var NET='';
var GLEAD=null,LEADBEST=0,NETTXT='';
// Division dérivée du percentile du jour — mesure de maîtrise lisible d'un coup d'œil,
// jamais un palier acheté : elle ne vaut que pour aujourd'hui, sur la graine du jour.
var DIVS=[{p:0,n:'POUSSIÈRE',c:'150,160,175'},{p:40,n:'CENDRE',c:'170,180,195'},
  {p:60,n:'BRAISE',c:'255,150,90'},{p:80,n:'FLAMME',c:'255,95,110'},
  {p:93,n:'HALO',c:'190,140,255'},{p:98,n:'SINGULARITÉ',c:'255,255,255'}];
function divFor(pct){var d=DIVS[0];for(var i=0;i<DIVS.length;i++)if(pct>=DIVS[i].p)d=DIVS[i];return d;}
function netGet(){
  if(!NET)return;
  try{
    var ac=new AbortController();setTimeout(function(){try{ac.abort();}catch(e){}},2500);
    fetch(NET+'/day?s='+encodeURIComponent(seedStr),{signal:ac.signal,cache:'no-store'})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j)return;
        if(j.ghost&&j.ghost.length>40){GLEAD=j.ghost;LEADBEST=j.best||0;}
        if(j.n>2)NETTXT=j.n+' PLONGEURS SUR CE SECTEUR  ·  MEILLEUR '+Math.round(j.best).toLocaleString('fr-FR');
      })['catch'](function(){});
  }catch(e){}
}
function netPost(sc,dp,gh){
  if(!NET)return;
  try{
    var ac2=new AbortController();setTimeout(function(){try{ac2.abort();}catch(e){}},2800);
    fetch(NET+'/run',{method:'POST',signal:ac2.signal,headers:{'content-type':'application/json'},
      body:JSON.stringify({u:UID,s:seedStr,sc:Math.round(sc),d:Math.round(dp),g:gh})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j||!j.n||j.n<3)return;
        if(j.ghost&&j.ghost.length>40){GLEAD=j.ghost;LEADBEST=j.best||0;}
        var el=document.getElementById('fnet');
        if(el){
          var pct=j.pct|0,dv=divFor(pct);
          el.innerHTML='<b style="color:rgb('+dv.c+')">'+dv.n+'</b>  ·  TOP '+Math.max(1,100-pct)+' %  ·  '+j.n+' PLONGEURS AUJOURD’HUI';
        }
      })['catch'](function(){});
  }catch(e){}
}

function grade(){var g=GRADES[0][1];for(var i=0;i<GRADES.length;i++)if((all.mis||0)>=GRADES[i][0])g=GRADES[i][1];return g;}

var MISPER=60,misLast=-52,MIS=null,misGap=12,misEl,misH,misT,misP,misMini=0,NEWSKIN=null;
function misRaw(k){
  if(k==='_depth')return depth;
  if(k==='_spd')return MIS?MIS.acc:0;
  return ST[k]||0;
}
function misProg(){
  if(!MIS)return 0;
  return MIS.p.k==='_spd'?MIS.acc:Math.max(0,misRaw(MIS.p.k)-MIS.base);
}
function misShow(cls,head,txt){
  if(!misEl)return;
  misEl.className='show'+(cls?' '+cls:'');misMini=0;
  misH.textContent=TR(head);misT.textContent=TR(txt);
}
function misIssue(){
  var p=MPOOL[(Math.random()*MPOOL.length)|0];
  all.misq=(all.misq||0)+1;
  MIS={p:p,base:0,acc:0,t:p.d};MIS.base=misRaw(p.k);misLast=T;
  misShow('',HAIL[(Math.random()*HAIL.length)|0]+'  MISSION '+all.misq,p.t);
  sMis();buzz([8,40,8],'mis',400);
}
function misResolve(){
  var p=MIS.p,pr=Math.min(1,misProg()/p.n),gain=Math.round(p.b*pr);
  if(gain>0){o2=Math.min(O2MAX,o2+gain);if(apnea>0){apnea=0;ST.saves++;}}
  if(pr>=1){
    var wl=[];for(var uu=0;uu<SKINS.length;uu++)wl.push(!unlocked(uu));
    all.mis=(all.mis||0)+1;ST.mission++;
    for(var uv=0;uv<SKINS.length;uv++)if(wl[uv]&&unlocked(uv)){NEWSKIN=SKINS[uv];showZone('COQUE DÉBLOQUÉE · '+SKINS[uv]);sRecord();buzz([16,30,16,30,16,30,90]);}
    misShow('ok','MISSION '+all.misq+' ▸ REMPLIE','+'+gain+' O₂   ·   '+OKW[(Math.random()*OKW.length)|0]);
    ev('MISSION REMPLIE',16,'121,212,255');sMisOk(1);kick(0.09,.8);buzz([12,28,12,28,60]);
  }else if(pr>0.34){
    misShow('','MISSION '+all.misq+' ▸ PARTIELLE','+'+gain+' O₂   ·   '+PAW[(Math.random()*PAW.length)|0]);
    sMisOk(0);buzz([10,30,10]);
  }else{
    misShow('ko','MISSION '+all.misq+' ▸ ÉCHOUÉE',KOW[(Math.random()*KOW.length)|0]);
    sMisKo();
  }
  MIS=null;
  setTimeout(function(){if(!MIS&&misEl)misEl.className='';},3400);
}
function misStep(){
  if(state!=='play'){if(misEl&&misEl.className)misEl.className='';return;}
  if(!misEl){misEl=document.getElementById('mis');misH=document.getElementById('misH');misT=document.getElementById('misT');misP=document.getElementById('misP').firstElementChild;}
  if(!MIS){if(T-misLast>=MISPER&&T>8)misIssue();return;}   // au moins MISPER secondes entre deux émissions
  if(MIS.p.k==='_spd'&&Math.hypot(P.vx,P.vy)>60)MIS.acc+=DT;
  MIS.t-=DT;
  var pr=Math.min(1,misProg()/MIS.p.n);
  misP.style.width=(pr*100).toFixed(0)+'%';
  if(!misMini&&MIS.t<MIS.p.d-6.5){misMini=1;misEl.className='show mini';misH.textContent=TR('MISSION ')+all.misq+'  ▸  '+(MIS.p.k==='_spd'||MIS.p.k==='_depth'?Math.floor(misProg()):misProg())+'/'+MIS.p.n+'   ·   '+Math.ceil(MIS.t)+'s'+(MIS.p.nv?'   ·   '+TR('SANS SOUFFLE'):'');}
  else if(misMini)misH.textContent=TR('MISSION ')+all.misq+'  ▸  '+(MIS.p.k==='_spd'||MIS.p.k==='_depth'?Math.floor(misProg()):misProg())+'/'+MIS.p.n+'   ·   '+Math.ceil(MIS.t)+'s'+(MIS.p.nv?'   ·   '+TR('SANS SOUFFLE'):'');
  if(pr>=1||MIS.t<=0)misResolve();
}
// souffler pendant une mission « sans souffle » remet le compteur à zéro : on ne perd pas la mission, on recommence
function misVent(){
  if(!MIS||!MIS.p.nv)return;
  if(misProg()>0){MIS.base=misRaw(MIS.p.k);MIS.acc=0;pop('PROGRESSION ANNULÉE','255,140,140');buzz(18);}
}

var SKINS=['FUSÉE','ZIZI','CONCOMBRE','COMÈTE'],SKINGLOW=['255,255,255','255,186,166','150,230,120','255,205,120'];
// debloquees par des exploits cumules : c'est le seul actif du joueur qui survit a la journee
// chaque palier est une preuve d'adresse déjà suivie dans `all`, jamais un achat —
// ça garde l'équité de la graine partagée intacte pour un futur classement.
var SKINREQ=[null,
  {k:'chain', n:6,   t:'UNE CHAÎNE DE 6'},
  {k:'depth', n:2500,t:'DESCENDRE À 2 500 M'},
  {k:'comet', n:3,   t:'INTERCEPTER 3 COMÈTES'}];
function unlocked(i){var q=SKINREQ[i];return !q||(all[q.k]||0)>=q.n;}
function lockTxt(i){var q=SKINREQ[i];return q?q.t+'  ·  '+Math.min(all[q.k]||0,q.n)+'/'+q.n:'';}
var skin=sget('skin',0)|0;if(!(skin>=0&&skin<SKINS.length)||!unlocked(skin))skin=0;
var view=skin;   // ce qu'on regarde dans le sélecteur ; ce qu'on pilote reste 'skin'
var PKW=108,PKH=116,picks=[document.getElementById('pickA'),document.getElementById('pickB')];

// plaque : silhouette de fusée, c'est elle qui signale « ceci se tape »
function plaque(c){
  c.beginPath();
  c.moveTo(54,5);
  c.bezierCurveTo(78,26,84,48,84,66);
  c.lineTo(84,86);c.lineTo(101,105);c.lineTo(70,105);
  c.quadraticCurveTo(54,112,38,105);
  c.lineTo(7,105);c.lineTo(24,86);c.lineTo(24,66);
  c.bezierCurveTo(24,48,30,26,54,5);
  c.closePath();
}
function paintPicks(){
  var lit='rgba('+SKINGLOW[skin]+',';
  for(var i=0;i<picks.length;i++){
    var el=picks[i],cnv=el.firstElementChild,c=cnv.getContext('2d');
    if(cnv.width!==Math.round(PKW*DPR)){cnv.width=Math.round(PKW*DPR);cnv.height=Math.round(PKH*DPR);}
    c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,PKW,PKH);
    plaque(c);
    c.fillStyle='rgba(6,14,26,.62)';c.fill();
    c.strokeStyle=lit+'.55)';c.lineWidth=1.6;c.stroke();
    plaque(c);c.strokeStyle=lit+'.14)';c.lineWidth=5;c.stroke();   // halo
    var old=ctx,keep=skin;ctx=c;skin=view;
    try{
      if(unlocked(view))rocket(54,53,15,0,0.09,false);
      else{ctx.globalAlpha=.30;rocket(54,53,15,0,0,true);ctx.globalAlpha=1;}
    }finally{skin=keep;ctx=old;}   // sans ce finally, une erreur ici dessine tout le jeu dans la vignette
    el.lastElementChild.firstElementChild.textContent=SKINS[view];
    var lk=document.getElementById('locktip');
    if(lk)lk.textContent=unlocked(view)?'':'VERROUILLÉ — '+lockTxt(view);
  }
}
function cycleSkin(){
  view=(view+1)%SKINS.length;                 // on peut TOUJOURS faire défiler : voir la coque verrouillée est le moteur
  if(unlocked(view)){skin=view;sset('skin',skin);}
  paintPicks();
  if(state==='title'){
    rings.push({x:P.x,y:P.y,r:PR*1.6,vr:22,l:18,m:18,c:SKINGLOW[view],w:1.8});
    burst(P.x,P.y,10,SKINGLOW[view],11,20);
  }
  sFizzle();sSnap();
}
for(var pi=0;pi<picks.length;pi++){
  picks[pi].addEventListener('pointerdown',function(e){e.stopPropagation();});
  picks[pi].addEventListener('pointerup',function(e){e.stopPropagation();e.preventDefault();initAudio();cycleSkin();});
}

var ZIMG=[null];
for(var zi=1;zi<ZSRC.length;zi++){var zg=new Image();
  zg.onload=function(){try{crewLabels();if(scCrew&&!scCrew.classList.contains('hide'))paintCrew();}catch(e){}};

function zReady(i){var g=ZIMG[i];return !!(g&&g.complete&&g.naturalWidth);}

// buste : l'illustration d'origine, contenue dans la boîte, calée en bas. Aucune déformation.
function zSprite(c,x,y,w,h,i){
  if(i===0){pilotBust(c,x+w/2,y+h,h*0.42);return;}
  if(!zReady(i))return;
  var g=ZIMG[i],k=Math.min(w/g.naturalWidth,h/g.naturalHeight),
      dw=g.naturalWidth*k,dh=g.naturalHeight*k;
  c.drawImage(g,x+(w-dw)/2,y+h-dh,dw,dh);
}
// tête dans le hublot : haut du sprite, calé sur le bas du verre
function zGlass(c,hx,hy,hr,i){
  if(!zReady(i))return;
  var g=ZIMG[i],sw=g.naturalWidth,sh=g.naturalHeight*0.62,
      k=Math.min(hr*2.05/sw,hr*2.05/sh),dw=sw*k,dh=sh*k;
  c.drawImage(g,0,0,sw,sh,hx-dw/2,hy+hr*0.98-dh,dw,dh);
}

function pilotBust(c,x,yb,s){
  c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(x,yb-s*0.05,s*0.8,s*0.14,0,0,6.2832);c.fill();
  c.fillStyle='#e8452f';
  c.beginPath();c.moveTo(x-s*0.62,yb-s*0.06);
  c.bezierCurveTo(x-s*0.8,yb-s*0.7,x-s*0.6,yb-s*1.0,x-s*0.34,yb-s*1.08);
  c.lineTo(x+s*0.34,yb-s*1.08);
  c.bezierCurveTo(x+s*0.6,yb-s*1.0,x+s*0.8,yb-s*0.7,x+s*0.62,yb-s*0.06);

/* ================= simulation ================= */
function step(){
  F++;T+=DT;
  var ci=Math.floor(P.y/BAND),view=CH/SC;

  for(var i=ci-2;i<=ci+4;i++){
    var fe=feats(i).e;
    for(var j=0;j<fe.length;j++){
      var e=fe[j];
      if(Math.abs(e.y-P.y)>view)continue;
      e.t--;
      if(e.t<=0){e.t=100;clouds.push({x:e.x+e.d*3,y:e.y,vx:e.d*5,vy:0,r:5.5,amt:9,life:470});}
    }
  }

  if(P.anchor){
    var a=P.anchor,dx=P.x-a.x,dy=P.y-a.y,dl=Math.hypot(dx,dy)||1;
    var minL=a.rad+MINLEN_PAD;
    if(P.reeling&&P.len>minL){
      // treuil tenu : raccourcir accélère (moment angulaire conservé)
      var nl=Math.max(minL,P.len-REEL*DT),ratio=P.len/nl;
      P.vx*=ratio;P.vy*=ratio;P.len=nl;
      if(F%3===0)burst(a.x+dx/dl*P.len,a.y+dy/dl*P.len,1,'255,225,150',6,12);
      P.reelT+=DT;if(P.reelT>.4&&!P.reelCounted){H.reel++;P.reelCounted=true;}
    }
    var cap=a.kind==='spin'?SPIN_MAX:MAXSPD,sp0=Math.hypot(P.vx,P.vy);
    if(a.kind==='spin'&&sp0>0.1&&sp0<cap){var kk=Math.min(cap,sp0+SPIN_ACC*DT)/sp0;P.vx*=kk;P.vy*=kk;sp0*=kk;}
    if(sp0>cap){P.vx=P.vx/sp0*cap;P.vy=P.vy/sp0*cap;}
    P.capped=sp0>=cap*.995;
    dx/=dl;dy/=dl;
    P.x=a.x+dx*P.len;P.y=a.y+dy*P.len;
    var rad=P.vx*dx+P.vy*dy;
    P.vx-=rad*dx;P.vy-=rad*dy;
    var an=Math.atan2(dy,dx),da0=an-P.prevA;da0=Math.atan2(Math.sin(da0),Math.cos(da0));P.revs+=Math.abs(da0)/6.283;P.prevA=an;
    // classes de planètes
    if(a.kind==='oasis'&&a.res>0){
      var og=Math.min(a.res,OASIS_RATE*DT,O2MAX-o2);
      if(og>0){
        if(apnea>0){apnea=0;ST.saves++;ev('SAUVÉ',30,'255,255,255');sSave();buzz([10,20,40]);}
        o2+=og;a.res-=og;
        if(F%3===0){var sx0=a.x+dx*a.rad,sy0=a.y+dy*a.rad;parts.push({x:sx0,y:sy0,vx:(P.x-sx0)*3.2,vy:(P.y-sy0)*3.2,l:16,m:16,c:'85,230,255',r:1.1});}
        if(F%24===0)sOasis();
        buzz(5,'oasis',220);
        if(a.res<=0.05){a.res=0;a.pal=PAL[0];ST.oasis++;if(traceE.length<900)traceE.push({x:a.x,y:a.y,k:'o'});ev('OASIS VIDÉE',8,'85,230,255');}
      }
    }
    if(a.kind==='crown'&&!a.used&&P.revs>=1){
      a.used=true;a.pal=PAL[4];ST.crown++;ev('COURONNE',10,'255,200,70');
      addCharge(need(FX.tier)-FX.bar+0.01);sRecord();buzz([10,30,10,30,60]);
      burst(a.x,a.y,26,'255,200,70',26,34);
    }
    if(a.kind==='pulsar'){
      var pix=Math.floor((T+a.ph)/PULSE);
      if(pix!==P.pulseIdx){
        P.pulseIdx=pix;P.pulses++;buzz(10);
        if(P.pulses>=4){
          P.anchor=null;P.reeling=false;P.lastRel=a;P.relT=T-1;
          o2=Math.max(0,o2-8);loseBar(.35,true);FX.chain=0;shake=10;flash=.8;
          burst(P.x,P.y,22,'255,140,110',26,30);pop('SURCHARGE','255,95,82');sHit(1);sSnap();buzz(45);
        }
      }
    }
    if(P.anchor&&Math.abs(P.y-a.y)>ANCHOR_RANGE*3){P.anchor=null;P.reeling=false;}
  } else {P.capped=false;P.reelT=0;}

  var py0=P.y,px0=P.x;
  P.x+=P.vx*DT;P.y+=P.vy*DT;
  var spd=Math.hypot(P.vx,P.vy);
  var w=wallAt(P.y);
  var dLeft=(P.x-PR)-w.l,dRight=w.r-(P.x+PR);

  function hitWall(nx){
    var inc=Math.abs(P.vx)/(Math.hypot(P.vx,P.vy)||1);
    if(inc<0.42){
      P.vx=nx*Math.abs(P.vx)*0.25;shake=2;loseBar(.05,false);sGraze();
      burst(P.x,P.y,3,'190,215,245',7,10);
    } else {
      P.vx=nx*Math.abs(P.vx)*0.42;shake=4+inc*4;
      loseBar(.1+inc*.2,false);FX.chain=0;sHit(inc);buzz(18);
      burst(P.x,P.y,6,'150,180,220',11,15);
    }
    if(P.anchor){P.anchor=null;P.reeling=false;pop('FILIN ROMPU','255,150,130');sSnap();}
  }
  if(dLeft<0){P.x=w.l+PR;hitWall(1);}
  if(dRight<0){P.x=w.r-PR;hitWall(-1);}

  if(grazeCd>0)grazeCd--;
  var md=Math.min(dLeft,dRight);
  grazing=(md>0&&md<1.9&&spd>36)?1-md/1.9:0;
  if(grazing>0)P.grazeSide=(dLeft<dRight)?-1:1;
  if(grazing>0){
    addCharge(DT*grazing*spd/3.5);FX.lastEv=T;
    buzz(6,'graze',140-100*grazing);
    if(grazeCd===0){ST.graze++;grazeCd=26;ev('FRÔLÉ',6,'200,230,255');sGraze();burst(dLeft<dRight?w.l:w.r,P.y,5,'200,230,255',9,14);}
  }
  if(P.y<PR){P.y=PR;P.vy=Math.abs(P.vy)*0.40;}

  if(atmoCd>0)atmoCd--;
  inAtmo=false;
  for(var ai=ci-2;ai<=ci+2;ai++){
    var fa3=feats(ai).a;
    for(var aj=0;aj<fa3.length;aj++){
      var pl=fa3[aj],pd=Math.hypot(P.x-pl.x,P.y-pl.y);
      if(pd<pl.rad+2.2){
        inAtmo=true;
        var dr=P.anchor?0.997:0.988;P.vx*=dr;P.vy*=dr;
        if(spd>26){addCharge(DT*spd/8);FX.lastEv=T;}
        if(atmoCd===0&&spd>26){atmoCd=50;ST.atmo++;ev('ATMOSPHÈRE',5+spd/10,'255,200,140');sAtmo(spd);buzz(5);}
      }
    }
  }

  for(var k=ci-2;k<=ci+3;k++){
    var fg=feats(k).g;
    for(var m=0;m<fg.length;m++){
      var g2=fg[m];
      if(g2.fl>0)g2.fl-=0.06;
      if(g2.done)continue;
      if(py0<g2.y&&P.y>=g2.y){
        var tt=(g2.y-py0)/((P.y-py0)||1),cx=px0+(P.x-px0)*tt,off=Math.abs(cx-g2.x);
        if(off<g2.w){
          g2.done=true;g2.fl=1;ST.gate++;o2=Math.min(O2MAX,o2+4);
          var razor=off>g2.w-1.4,gain=10+spd/8;
          if(razor){gain+=12;ST.razor++;}
          if(traceE.length<900)traceE.push({x:g2.x,y:g2.y,k:'g'});
          ev(razor?'AU FIL':'PORTE',gain,'120,255,200');sGate(FX.chain,razor);buzz(razor?[8,18,12]:14);
          burst(g2.x,g2.y,razor?20:12,'120,255,200',16,24);
        }
      }
    }
  }

  if(P.ram&&spd<=MAXSPD)P.ram=false;
  for(var k2=ci-2;k2<=ci+3;k2++){
    var fh=feats(k2).h;
    for(var m2=0;m2<fh.length;m2++){
      var z=fh[m2];if(z.dead)continue;
      var hx=z.bx+Math.sin(F*0.016*z.sp+z.ph)*z.amp,hd=Math.hypot(P.x-hx,P.y-z.y);
      if(hd<z.rr+PR&&P.ram){
        z.dead=true;ST.smash=(ST.smash||0)+1;
        ev('PULVÉRISÉ',20,'190,150,255');
        burst(hx,z.y,26,'255,150,120',26,30);burst(hx,z.y,14,'190,150,255',19,26);
        rings.push({x:hx,y:z.y,r:z.rr,vr:48,l:20,m:20,c:'255,160,120',w:2.4});
        kick(0.07,0.65);shake=9;flash=0.35;
        P.vx*=0.94;P.vy*=0.94;                     // le choc mord un peu sur l'élan : la série a une fin
        if(traceE.length<900)traceE.push({x:hx,y:z.y,k:'h'});
        sSmash();buzz([22,26,14]);
      } else if(hd<z.rr+PR){
        o2-=5;ST.hit++;shake=12;flash=1;FX.chain=0;FX.bar=0;if(FX.tier>1)tierDown();FX.bar=0;
        var nx=(P.x-hx)||0.1,ny=(P.y-z.y)||0.1,nl2=Math.hypot(nx,ny);
        P.vx+=nx/nl2*24;P.vy+=ny/nl2*24;if(P.anchor){P.anchor=null;P.reeling=false;}
        if(traceE.length<900)traceE.push({x:P.x,y:P.y,k:'h'});
        burst(hx,z.y,18,'255,95,82',23,28);pop('IMPACT','255,95,82');
        sHit(1);buzz(45);z.nm=T;
      } else if(hd<z.rr+PR+2.6&&spd>28&&T-z.nm>1.2&&state==='play'){
        z.nm=T;ST.dodge++;ev('ESQUIVE',12,'255,170,150');sDodge();buzz([6,12,6]);
      }
    }
  }

  for(var c1=clouds.length-1;c1>=0;c1--){
    var c=clouds[c1];
    c.x+=c.vx*DT;c.y+=c.vy*DT;c.vx*=0.992;c.vy*=0.992;c.r+=0.018;c.life--;
    if(c.life<=0||c.amt<0.25||Math.abs(c.y-P.y)>view*1.6)clouds.splice(c1,1);
  }
  stepFx();
  if(F%2===0){trail.push({x:P.x,y:P.y,t:FX.tier});if(trail.length>700)trail.shift();}
  for(var q=ci-2;q<=ci+2;q++){
    var fa2=feats(q).a;
    for(var q2=0;q2<fa2.length;q2++)if(fa2[q2].p>0)fa2[q2].p-=0.045;
  }

  if(spd>4)P.tang=Math.atan2(P.vy,P.vx)+Math.PI/2;
  var da=P.tang-P.ang;
  while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;
  P.ang+=da*0.22;
  if(flame>0)flame-=0.055;

  var gain2=P.y-py0;
  if(gain2>0){score+=gain2*FX.tier*(surflux>0?2:1);if(P.y>depth){depth=P.y;
    if(Math.floor(depth/100)>trace.length)trace.push(FX.tier);
    if(!recFlag&&REC_DAY>150&&depth>REC_DAY){recFlag=true;ev('RECORD DU JOUR',25,'255,255,255');showZone('RECORD DU JOUR DÉPASSÉ');sRecord();buzz([10,30,10,30,50]);}
  }}
  if(T-FX.lastEv>DECAY_AFTER&&grazing<=0){FX.bar-=DT*need(FX.tier)*.25;if(FX.bar<0){if(FX.tier>1)tierDown();else FX.bar=0;}}
  if(apnea>0){
    apnea-=DT;o2=0;
    if(apnea<=0){apnea=0;explode();return;}
  } else {
    o2-=(0.9+Math.min(0.7,depth/15000*0.7))*DT;
    if(o2<=0){o2=0;apnea=APNEA;sApnea();buzz([40,80,40]);pop('APNÉE','255,95,82');}
  }
  if(P.reeling)buzz(4,'reel',Math.max(45,Math.min(260,4000/(1+spd*spd/40))));
  if(o2<25&&apnea<=0)buzz(10,'low',900);
  if(shake>0)shake-=0.45;
  if(flash>0)flash-=0.05;
  if(tierPulse>0)tierPulse-=0.04;
  lowT=o2<28?lowT+DT:0;
  if(F%6===0&&ghostRec.length<24000)ghostRec.push(Math.round(P.x*10),Math.round(P.y*10));
  if(F%2===0&&traceP.length<45000)traceP.push(P.x,P.y,FX.tier,Math.hypot(P.vx,P.vy));

  if(surflux>0){surflux-=DT;if(surflux<=0){surflux=0;pop('SURFLUX FINI','200,140,200');}}
  ACT+=(actAt(P.y/BAND)-ACT)*0.04;
  cometTry();cometStep();misStep();
  var z2=zoneFor(depth);
  if(z2!==zi){zi=z2;showZone(ZONES[zi].n);sZone();buzz([12,40,12]);}
  if(F%150===0)prune(ci);
}
function stepFx(){
  for(var p1=parts.length-1;p1>=0;p1--){
    var pa=parts[p1];
    pa.x+=pa.vx*DT;pa.y+=pa.vy*DT;pa.vx*=0.94;pa.vy*=0.94;pa.l--;
    if(pa.l<=0)parts.splice(p1,1);
  }
  for(var o1=pops.length-1;o1>=0;o1--){pops[o1].l--;if(pops[o1].l<=0)pops.splice(o1,1);}
  for(var r1=rings.length-1;r1>=0;r1--){var rg=rings[r1];rg.r+=rg.vr*DT;rg.vr*=0.93;rg.l--;if(rg.l<=0)rings.splice(r1,1);}
}

function planet(x,y,r,pl,near,spin){

    ctx.beginPath();ctx.ellipse(0,0,r*1.72,r*0.44,0,Math.PI,6.2832);ctx.stroke();ctx.restore();
  }
  // corps plat
  ctx.fillStyle=pl.pal.b;
  ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.clip();

  ctx.fillStyle=pl.pal.a;
  ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.34,r*0.82,0,6.2832);ctx.fill();
  // bandes
  ctx.fillStyle=pl.pal.c;
  ctx.globalAlpha=.55;
  ctx.beginPath();ctx.ellipse(x,y+r*(0.28+(pl.band-0.5)*0.4),r*1.3,r*0.17,pl.tilt*0.4,0,6.2832);ctx.fill();
  ctx.globalAlpha=.4;
  ctx.beginPath();ctx.ellipse(x,y+r*0.72,r*1.3,r*0.26,pl.tilt*0.4,0,6.2832);ctx.fill();
  ctx.globalAlpha=1;
  // ombre basse
  ctx.fillStyle='rgba(20,16,40,.3)';
  ctx.beginPath();ctx.arc(x+r*0.52,y+r*0.5,r*0.95,0,6.2832);ctx.fill();
  ctx.restore();
  if(pl.ring){
    ctx.save();ctx.translate(x,y);ctx.rotate(pl.tilt);
    ctx.strokeStyle='rgba(255,252,245,.75)';ctx.lineWidth=Math.max(1.6,r*0.17);
    ctx.beginPath();ctx.ellipse(0,0,r*1.72,r*0.44,0,0,Math.PI);ctx.stroke();ctx.restore();
  }
  if(pl.moon){
    var mx=x+Math.cos(spin*1.6+pl.ph)*r*2.1,my=y+Math.sin(spin*1.6+pl.ph)*r*0.8;
    ctx.fillStyle='#fdf6ea';ctx.beginPath();ctx.arc(mx,my,r*0.2,0,6.2832);ctx.fill();
  }
}
function drawStars(Z){

  // planètes

  // fantôme du meilleur plongeon du jour
  if(GHOST&&state==='play'){

      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(X(gx),Y(gyy),PR*SC*.9,0,6.2832);ctx.stroke();

  if(trail.length>2){

  var sblur=Math.max(0,Math.min(1,(spd-42)/46));
  if(sblur>0.02&&state==='play'){
    var ux2=P.vx/(spd||1),uy2=P.vy/(spd||1),pcx=X(P.x),pcy=Y(P.y);
    ctx.lineCap='round';

  for(var r2=0;r2<rings.length;r2++){

  if(surflux>0){

  }
  // vignette de vitesse : elle serre le regard vers le centre quand ca va vite, et sur les bascules

  ctx.save();ctx.translate(sx,sy);

  if(spd>52){

    ctx.strokeStyle='rgba(200,230,255,'+iv+')';ctx.lineWidth=1.2;
    for(var v2=0;v2<9;v2++){
      var vlx=((v2*137+F*3)%CW),vly=((v2*211+F*13)%CH);
      ctx.beginPath();ctx.moveTo(vlx,vly);ctx.lineTo(vlx,vly+28+iv*70);ctx.stroke();
    }
  }
  if(FX.tier>2||tierPulse>0){
    var fi=Math.min(0.3,(FX.tier-1)/30+tierPulse*.25);
    var fgd=ctx.createRadialGradient(CW/2,CH/2,CH*0.3,CW/2,CH/2,CH*0.78);
    fgd.addColorStop(0,'rgba('+tcs+',0)');fgd.addColorStop(1,'rgba('+tcs+','+fi+')');
    ctx.fillStyle=fgd;ctx.fillRect(0,0,CW,CH);
  }
  var vg0=ctx.createRadialGradient(CW/2,CH/2,CH*0.34,CW/2,CH/2,CH*0.82);
  vg0.addColorStop(0,'rgba(0,0,0,0)');vg0.addColorStop(1,'rgba(0,0,0,.2)');
  ctx.fillStyle=vg0;ctx.fillRect(0,0,CW,CH);
  if(apnea>0){
    ctx.globalCompositeOperation='saturation';ctx.fillStyle='rgba(128,128,128,'+(0.95-apnea/APNEA*.35).toFixed(2)+')';ctx.fillRect(0,0,CW,CH);
    ctx.globalCompositeOperation='source-over';
  }
  if((o2<28||apnea>0)&&state==='play'){
    var pu=apnea>0?0.3+Math.pow(Math.max(0,Math.sin(T*7.5)),6)*0.4:0.16+Math.abs(Math.sin(lowT*4.2))*0.28*(1-o2/28);
    var vg=ctx.createRadialGradient(CW/2,CH/2,CH*0.22,CW/2,CH/2,CH*0.74);
    vg.addColorStop(0,'rgba(255,60,50,0)');vg.addColorStop(1,'rgba(255,60,50,'+pu+')');
    ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  }
  if(flash>0){ctx.fillStyle='rgba(255,90,80,'+(flash*0.32)+')';ctx.fillRect(0,0,CW,CH);}
}

var ptr=null,lastTap={t:-9,x:0,y:0};
var scStart=document.getElementById('start'),scEnd=document.getElementById('end'),elAgain=document.getElementById('again');
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();initAudio();
  if(state==='dead'||state==='dying'||ptr)return;
  var now=performance.now();
  ptr={id:e.pointerId,t0:now,ag:false,inh:false};
  aim={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY};gest='tap';
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(state!=='play')return;
  var c=cloudUnder();if(c)ptr.inh=doInhale(c);   // inspirer au toucher : zéro latence
  if(now-lastTap.t<DTAP&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<80){
    ptr.ag=true;lastTap.t=-9;
    var np=nearestPlanet();
    if(np)doAnchor(np.o,np.d);
    else{sFizzle();rings.push({x:P.x,y:P.y,r:1,vr:14,l:14,m:14,c:'140,150,165',w:1.5});}
  }
},{passive:false});
cv.addEventListener('pointermove',function(e){
  if(!ptr||e.pointerId!==ptr.id)return;e.preventDefault();
  aim.x=e.clientX;aim.y=e.clientY;
  if(gest==='tap'&&Math.hypot(aim.x-aim.sx,aim.y-aim.sy)>16){gest='drag';P.reeling=false;}
},{passive:false});
cv.addEventListener('pointerup',function(e){
  if(!ptr||e.pointerId!==ptr.id)return;e.preventDefault();
  var now=performance.now();
  if(gest==='drag'){
    var dx=aim.x-aim.sx,dy=aim.y-aim.sy;
    if(Math.hypot(dx,dy)>16){if(state==='title')startGame();if(state==='play')vent(dx,dy);}
  } else if(state==='play'&&!ptr.ag&&now-ptr.t0<230){
    lastTap={t:now,x:aim.x,y:aim.y};
    if(P.anchor){var wasInh=ptr.inh;doRelease();if(wasInh)ev('SECOND SOUFFLE',10,'85,230,255');}
  }
  ptr=null;aim=null;gest=null;P.reeling=false;
},{passive:false});
cv.addEventListener('pointercancel',function(){ptr=null;aim=null;gest=null;if(P)P.reeling=false;});

var GRX=null;
function gbuild(){
  GRX={};
  for(var L in GDICT){
    var ks=Object.keys(GDICT[L]).sort(function(a,b){return b.length-a.length;});
    GRX[L]=new RegExp(ks.map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|'),'g');
  }
}
function TR(x){
  try{
    if(x==null||UILANG==='fr')return x;
    var d=GDICT[UILANG];if(!d)return x;
    var s=''+x;
    if(d[s]!==undefined)return d[s];
    if(!GRX)gbuild();
    return s.replace(GRX[UILANG],function(m){return d[m]!==undefined?d[m]:m;});
  }catch(e){return x;}
}

var acc=0,last=0,deadLock=0;
function loop(t){
  if(!last)last=t;
  var d=Math.min(0.1,(t-last)/1000);last=t;
  if(state==='play'){
    P.reeling=!!(ptr&&gest==='tap'&&P.anchor&&(performance.now()-ptr.t0>(ptr.ag?40:110)));
    if(hitstop>0){hitstop-=d;acc=0;}
    else{
      acc+=d;var g=0;
      while(acc>=DT&&g<6&&state==='play'){step();acc-=DT;g++;}
      if(acc>DT*6)acc=0;
    }
  } else if(state==='title'){
    T+=d;P.y=40+Math.sin(T*1.3)*1.2;P.ang=Math.sin(T*.7)*.12;stepFx();
  } else {
    T+=d;stepFx();
    if(shake>0)shake-=0.5;
  }
  if(state==='dead')elAgain.classList.toggle('lock',performance.now()<deadLock);
  draw();hud();audioUpdate();
  requestAnimationFrame(loop);
}

  if(state!=='play')return;

  setTimeout(gameOver,620);
}

function makePoster(){
  var PW=900,PH=1240,mx=44,mt=122,mb=132,aw=PW-mx*2,ah=PH-mt-mb;

  // le plongeon est découpé en colonnes : l'échelle choisie est celle qui remplit le mieux l'affiche
  var D=Math.max(90,depth+18),n=1,sc=0,k;
  for(k=1;k<=8;k++){var cand=Math.min(aw/(100*k),ah*k/D);if(cand>sc){sc=cand;n=k;}}
  var dpc=D/n,colW=100*sc,colH=dpc*sc,ox=mx+(aw-colW*n)/2,oy=mt+(ah-colH)/2;
  for(var col=0;col<n;col++){
    var x0=ox+col*colW,y0=col*dpc;
    g.save();
    g.beginPath();g.rect(x0,oy,colW,colH);g.clip();
    var zc=ZONES[zoneFor(y0+dpc*0.5)];
    var zg=g.createLinearGradient(0,oy,0,oy+colH);
    zg.addColorStop(0,'rgba('+zc.st+',0.055)');zg.addColorStop(1,'rgba('+zc.st+',0.02)');
    g.fillStyle=zg;g.fillRect(x0,oy,colW,colH);
    var stp=Math.max(1.5,3/sc);
    g.fillStyle='#0d121b';
    g.beginPath();g.moveTo(x0-4,oy-4);
    for(var y=y0;y<y0+dpc+stp;y+=stp)g.lineTo(x0+wallAt(y).l*sc,oy+(y-y0)*sc);
    g.lineTo(x0-4,oy+colH+4);g.closePath();g.fill();
    g.beginPath();g.moveTo(x0+colW+4,oy-4);
    for(var y2=y0;y2<y0+dpc+stp;y2+=stp)g.lineTo(x0+wallAt(y2).r*sc,oy+(y2-y0)*sc);
    g.lineTo(x0+colW+4,oy+colH+4);g.closePath();g.fill();
    g.strokeStyle='rgba(175,205,240,.34)';g.lineWidth=1.2;
    g.beginPath();for(var y3=y0;y3<y0+dpc+stp;y3+=stp)g.lineTo(x0+wallAt(y3).l*sc,oy+(y3-y0)*sc);g.stroke();
    g.beginPath();for(var y4=y0;y4<y0+dpc+stp;y4+=stp)g.lineTo(x0+wallAt(y4).r*sc,oy+(y4-y0)*sc);g.stroke();
    // la trajectoire, en pose longue
    g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
    for(var pass=0;pass<2;pass++){
      for(var i=4;i<traceP.length;i+=4){
        var ax=traceP[i-4],ay=traceP[i-3],bxp=traceP[i],byp=traceP[i+1],tr2=traceP[i+2],sp2=traceP[i+3];
        if(ay<y0-2||ay>y0+dpc+2||byp<y0-2||byp>y0+dpc+2)continue;
        if(Math.abs(bxp-ax)>40)continue;
        var tcl=cs(tierCol(tr2));
        g.strokeStyle='rgba('+tcl+','+(pass?0.95:0.14)+')';
        g.lineWidth=pass?(1.5+Math.min(3.2,sp2/26)):(7+Math.min(16,sp2/5.5));
        g.beginPath();g.moveTo(x0+ax*sc,oy+(ay-y0)*sc);g.lineTo(x0+bxp*sc,oy+(byp-y0)*sc);g.stroke();
      }
    }
    for(var e=0;e<traceE.length;e++){
      var ee=traceE[e];
      if(ee.y<y0-2||ee.y>y0+dpc+2)continue;
      var ex=x0+ee.x*sc,ey=oy+(ee.y-y0)*sc;
      if(ee.k==='a'){g.strokeStyle='rgba(255,209,102,.9)';g.lineWidth=1.5;g.beginPath();g.arc(ex,ey,5.5,0,6.2832);g.stroke();}
      else if(ee.k==='e'||ee.k==='s'){
        g.strokeStyle=ee.k==='s'?'rgba(255,70,150,.95)':'rgba(255,240,200,.95)';g.lineWidth=1.7;
        g.beginPath();for(var k2=0;k2<4;k2++){var an2=k2*1.5708+0.4;g.moveTo(ex,ey);g.lineTo(ex+Math.cos(an2)*10,ey+Math.sin(an2)*10);}g.stroke();
      }
      else if(ee.k==='g'){g.strokeStyle='rgba(120,255,200,.85)';g.lineWidth=1.7;g.beginPath();g.moveTo(ex-10,ey);g.lineTo(ex+10,ey);g.stroke();}
      else if(ee.k==='o'){g.fillStyle='rgba(85,230,255,.9)';g.beginPath();g.arc(ex,ey,4,0,6.2832);g.fill();}
      else if(ee.k==='c'){g.strokeStyle='rgba(255,240,190,.95)';g.lineWidth=1.8;g.beginPath();g.arc(ex,ey,7,0,6.2832);g.moveTo(ex-13,ey-13);g.lineTo(ex-6,ey-6);g.stroke();}
      else if(ee.k==='h'){g.strokeStyle='rgba(255,80,70,.9)';g.lineWidth=1.9;g.beginPath();g.moveTo(ex-5.5,ey-5.5);g.lineTo(ex+5.5,ey+5.5);g.moveTo(ex+5.5,ey-5.5);g.lineTo(ex-5.5,ey+5.5);g.stroke();}
    }
    g.globalCompositeOperation='source-over';
    g.restore();
    if(col<n-1){g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1;g.beginPath();g.moveTo(x0+colW,oy);g.lineTo(x0+colW,oy+colH);g.stroke();}
  }

  for(var q=0;q<900;q++)g.fillRect((Math.random()*PW)|0,(Math.random()*PH)|0,1,1);

}
